<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>捏脸</title>
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <div id="app" data-state="loading">
    <div id="stage"></div>
    <div class="fade"></div>

    <div class="toolbar left" role="toolbar" aria-label="设置">
      <button id="sound-tool" type="button" aria-pressed="true" title="关闭音效" aria-label="音效开关">
        <svg viewBox="0 0 28 24" width="24" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h5l6-5v16l-6-5H3z"/><path class="wave" d="M18 8.5q2.5 3.5 0 7M21.5 5.5q5 6.5 0 13"/><path class="mute" d="m19 9 6 6m0-6-6 6" style="display:none"/></svg>
      </button>
      <!-- 链接按钮由 site.json 的 links 生成（src/ui/site.js） -->
    </div>

    <!-- 右侧动作工具栏：按角色配置 personality.actions 生成（src/ui/toolbar.js） -->
    <div class="toolbar right" role="toolbar" aria-label="脸部动作"></div>

    <div id="loader" role="status" aria-live="polite">
      <div class="loader-card">
        <!-- 加载图由角色配置 presentation.images.loading 决定（src/core/loading.js）；没配就只显示进度条 -->
        <img alt="" width="960" height="1146" decoding="async" fetchpriority="high" hidden />
        <div class="loader-bar"><i id="loader-fill"></i></div>
        <div class="loader-text"><span id="loader-label">加载中…</span><span id="loader-pct">0%</span></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
